[package]
name = "neobar-render"
version = "0.1.0"
edition = "2021"
description = "Ultralight OSR render host for neobar — paints HTML views into wlr-layer-shell surfaces"

[[bin]]
name = "neobar-render"
path = "src/main.rs"

[dependencies]
# Ultralight bindings. ul-next is the most actively maintained Rust wrapper.
# NOTE: confirm it exposes the OSR GPUDriver / surface bitmap path needed for
# dmabuf export. If it does not, drop to the raw `ultralight-sys` C API.
ul-next = "0.4"

# Wayland + wlr-layer-shell + seat/input. smithay-client-toolkit bundles the
# layer-shell and linux-dmabuf protocol glue.
wayland-client = "0.31"
smithay-client-toolkit = "0.19"
wayland-protocols = { version = "0.32", features = ["client", "unstable"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }

# EGL + GL for importing Ultralight's GPU texture and exporting it as a dmabuf.
khronos-egl = { version = "6", features = ["dynamic"] }
gbm = "0.15"          # dmabuf allocation against the DRM render node
drm = "0.14"

# Control protocol with the Go core.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging.
log = "0.4"
env_logger = "0.11"

[profile.release]
opt-level = 3
lto = true
