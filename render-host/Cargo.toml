[package]
name = "neobar-render"
version = "0.1.0"
edition = "2021"
description = "CEF off-screen render host for neobar — paints HTML views into wlr-layer-shell surfaces"

[[bin]]
name = "neobar-render"
path = "src/main.rs"

[dependencies]
# Chromium Embedded Framework (BSD, uncapped). Off-screen rendering via the CPU
# OnPaint path on Linux (OnAcceleratedPaint/dmabuf is Windows-centric). The build
# script downloads the ~200MB CEF binaries to ~/.local/share/cef.
cef = "149.3"

# Wayland + wlr-layer-shell + wl_shm + seat/input (reused from the Ultralight host).
wayland-client = "0.31"
smithay-client-toolkit = "0.19"
calloop = "0.14"
calloop-wayland-source = "0.4"

# Control protocol with the Go core.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging.
log = "0.4"
env_logger = "0.11"

[profile.release]
opt-level = 3
lto = true
