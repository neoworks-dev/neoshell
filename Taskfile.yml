# Taskfile for neoshell. Requires go-task (https://taskfile.dev).
#
#   task dev     hot-reload dev: Vite (HMR) + Go core loading localhost:5173
#   task run     production: build UI + serve it from the Go core
#   task build   compile the render host, daemons, settings app, and Go core
#
# The Go core spawns the render host, so the render host must be built first.
# Binary paths are absolute (via ROOT_DIR) so they resolve regardless of the
# task's working directory (Go tasks run from apps/shell).
version: "3"

vars:
  # Svelte UI (git submodule).
  UI_DIR: apps/ui
  # C++/WPE render host (built by `make` in apps/render-host/).
  RENDER_BIN: '{{.ROOT_DIR}}/apps/render-host/neoshell-render'
  # Monitor connector to run on, e.g. `task dev MONITOR=DP-1`. Empty = default.
  # Run `task monitors` to list connectors.
  MONITOR: '{{.MONITOR | default ""}}'
  # Expands to the --monitor flag only when MONITOR is set, so the empty default
  # leaves the binary on its own default monitor.
  MONITOR_FLAG: '{{if .MONITOR}}--monitor {{.MONITOR}}{{end}}'
  # neoshell-bg wallpaper daemon. Release for fast image scaling.
  BG_BIN: '{{.ROOT_DIR}}/apps/bg/target/release/neoshell-bg'
  # neoshell-settings standalone app (Tauri). Spawned by the core on the gear button.
  SETTINGS_BIN: '{{.ROOT_DIR}}/apps/settings/target/release/neoshell-settings'
  # neoshell-search semantic file-search daemon. Spawned by the core at startup.
  SEARCH_BIN: '{{.ROOT_DIR}}/apps/shell/neoshell-search'
  # Python interpreter for the voice sidecars (created by voice:setup).
  VOICE_PYTHON: '{{.ROOT_DIR}}/apps/voice/.venv/bin/python'
  # Wallpaper image to set, e.g. `task wallpaper WALLPAPER=~/pic.png`.
  WALLPAPER: '{{.WALLPAPER | default ""}}'

env:
  # HTTP/WebSocket port for the Go core.
  NEOSHELL_PORT: '{{.NEOSHELL_PORT | default "9876"}}'
  # Surface plugins directory. The core reads each <id>/manifest.json to create
  # surfaces and serves each <id>/dist at /plugins/<id>/.
  NEOSHELL_PLUGINS: '{{.ROOT_DIR}}/apps/plugins'
  # Point the Go core at the render host built by render:build.
  NEOSHELL_RENDER_BIN: '{{.RENDER_BIN}}'
  # Let the core launch the settings app the gear button opens.
  NEOSHELL_SETTINGS_BIN: '{{.SETTINGS_BIN}}'
  # Let the core launch the semantic search daemon at startup.
  NEOSHELL_SEARCH_BIN: '{{.SEARCH_BIN}}'
  # Point the core at the voice sidecars' Python interpreter (best-effort: voice
  # stays disabled if the venv is absent). Modules run via `python -m`.
  NEOSHELL_VOICE_PYTHON: '{{.VOICE_PYTHON}}'

tasks:
  default:
    cmds:
      - task --list
    silent: true

  install:
    desc: Install UI dependencies (bun)
    dir: "{{.UI_DIR}}"
    cmds:
      - bun install

  render:build:
    desc: Build the C++/WPE render host (make)
    dir: apps/render-host
    cmds:
      - make

  core:build:
    desc: Build the Go core binary (./neoshell)
    dir: apps/shell
    cmds:
      - go build -o "{{.ROOT_DIR}}/neoshell" ./cmd/neoshell

  search:build:
    desc: Build the semantic file-search daemon (neoshell-search)
    dir: apps/shell
    cmds:
      - go build -o neoshell-search ./cmd/neoshell-search

  search:gpu:
    desc: >-
      Fetch the CUDA 12 runtime libs onnxruntime-gpu needs into
      <models>/cuda12, so embeddings run on the GPU. The daemon adds this dir to
      LD_LIBRARY_PATH. Needs `uv` and the system cuDNN 9 (pacman -S cudnn).
    vars:
      MODELS:
        sh: echo "${XDG_DATA_HOME:-$HOME/.local/share}/neoshell/models"
    cmds:
      - mkdir -p "{{.MODELS}}/cuda12"
      - >-
        uv pip install --target "{{.MODELS}}/.cuda-wheels"
        nvidia-cuda-runtime-cu12 nvidia-cublas-cu12 nvidia-cufft-cu12
        nvidia-cuda-nvrtc-cu12 nvidia-curand-cu12 nvidia-nvjitlink-cu12
      - find "{{.MODELS}}/.cuda-wheels/nvidia" -name '*.so*' -exec cp -an {} "{{.MODELS}}/cuda12/" \;
      - rm -rf "{{.MODELS}}/.cuda-wheels"
      - echo "CUDA 12 libs installed. Restart the daemon; log should show 'on CUDA GPU'."

  cli:install:
    desc: Install `neoshell` to $GOBIN (PATH) so Hyprland binds can call it in dev
    dir: apps/shell
    cmds:
      - go install ./cmd/neoshell

  voice:setup:
    desc: Create the Python venv for the voice sidecars (uv). Needs `uv`.
    dir: apps/voice
    cmds:
      - uv sync

  voice:models:
    desc: Pull the local Ollama models the voice fan-out uses (fast + slow tiers)
    cmds:
      - ollama pull gemma4:e4b

  voice:stt:
    desc: Run the Whisper STT sidecar alone (for manual socket testing)
    deps: [voice:setup]
    dir: apps/voice
    cmds:
      - uv run neoshell-voice-stt

  voice:tts:
    desc: Run the Chatterbox TTS sidecar alone (for manual socket testing)
    deps: [voice:setup]
    dir: apps/voice
    cmds:
      - uv run neoshell-voice-tts

  ui:build:
    desc: Build the settings-host UI to apps/ui/dist
    dir: "{{.UI_DIR}}"
    cmds:
      - bun run build

  plugins:build:
    desc: Build every surface plugin to apps/plugins/<id>/dist
    dir: apps/plugins
    cmds:
      - for d in bar dock desktop spotlight chat; do (cd "$d" && bun run build); done

  plugins:dev:
    desc: Single multi-page dev server for all plugin surfaces (HMR, port 5173)
    dir: apps/plugins-dev
    cmds:
      - bun run dev

  build:
    desc: Build the render host, daemons, the settings app, and the Go core
    deps: [render:build, bg:build, settings:build, search:build, core:build]

  ui:dev:
    desc: Run the Vite dev server with HMR (port 5173)
    dir: "{{.UI_DIR}}"
    cmds:
      - bun run dev

  core:dev:
    desc: Run the Go core (no --frontend, so the render host loads Vite on :5173)
    deps: [render:build, search:build, cli:install]
    dir: apps/shell
    cmds:
      - go run ./cmd/neoshell {{.MONITOR_FLAG}}

  dev:
    desc: >-
      Hot-reload dev — plugin surfaces via the multi-page aggregator (HMR) + Go
      core + wallpaper daemon. The settings app (gear) uses the built UI.
    deps: [settings:build, plugins:dev, core:dev, bg]

  run:
    desc: Production-like — build the UI + plugins and serve them from the Go core
    deps: [render:build, search:build, cli:install, ui:build, plugins:build]
    dir: apps/shell
    cmds:
      - go run ./cmd/neoshell --frontend "{{.ROOT_DIR}}/apps/ui/dist" {{.MONITOR_FLAG}}

  bg:build:
    desc: Build the neoshell-bg wallpaper daemon (release)
    dir: apps/bg
    cmds:
      - cargo build --release

  settings:build:
    desc: Build the neoshell-settings app (Tauri; first build is slow — webkit2gtk)
    dir: apps/settings
    cmds:
      - cargo build --release

  bg:
    desc: Run the wallpaper daemon (optionally WALLPAPER=path to set on start)
    deps: [bg:build]
    env:
      # Sample the bar strip on the same monitor the bar runs on.
      NEOSHELL_MONITOR: '{{.MONITOR}}'
    cmds:
      - "{{.BG_BIN}} daemon {{.WALLPAPER}}"

  wallpaper:
    desc: Set the wallpaper on a running daemon — task wallpaper WALLPAPER=~/pic.png
    deps: [bg:build]
    preconditions:
      - sh: test -n "{{.WALLPAPER}}"
        msg: "set WALLPAPER, e.g. task wallpaper WALLPAPER=~/pic.png"
    cmds:
      - "{{.BG_BIN}} img {{.WALLPAPER}}"

  monitors:
    desc: List monitor connectors usable with MONITOR=
    cmds:
      - hyprctl monitors -j | jq -r '.[].name'

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -f neoshell
      - rm -f apps/shell/neoshell-search
      - cd apps/render-host && make clean
      - cd apps/bg && cargo clean
      - cd apps/settings && cargo clean
