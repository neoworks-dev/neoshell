# Taskfile for neoshell. Requires go-task (https://taskfile.dev).
#
#   task dev     run the GTK shell, rebuilding and restarting it on every
#                source or style.css change
version: "3"

env:
  # gtk4-layer-shell has to be loaded before libwayland-client, which language
  # bindings cannot guarantee through normal imports.
  LD_PRELOAD: /usr/lib/libgtk4-layer-shell.so

tasks:
  default:
    cmds:
      - task --list
    silent: true

  install:
    desc: Install dependencies (bun; @neoworks/* are `bun link`ed)
    cmds:
      - bun install
    sources:
      - package.json
      - bun.lock

  tools:
    desc: Build the native helpers the shell spawns (window previews)
    sources:
      - tools/windowcapture/windowcapture.c
      - tools/windowcapture/*.xml
    generates:
      - tools/windowcapture/windowcapture
    cmds:
      - tools/windowcapture/build.sh

  quickshare:
    desc: Build the optional Quick Share helper (Rust, rqs_lib, GPL-3.0)
    dir: helpers/quickshare
    sources:
      - Cargo.toml
      - Cargo.lock
      - src/**/*.rs
    generates:
      - target/release/neoshell-quickshare
    cmds:
      - cargo build --release

  build:
    desc: Bundle the shell into a single ESM file GJS can run
    deps: [install]
    cmds:
      - node build.mjs

  start:
    aliases: [run]
    desc: Build and run the whole shell — takes over the session it runs in
    deps: [install, tools]
    interactive: true
    cmds:
      - node build.mjs
      - gjs -m dist/neoshell.js

  dev:
    desc: Run the shell and rebuild and restart it on every source or style change
    deps: [install, tools]
    interactive: true
    cmds:
      - node dev.mjs

  smoke:
    desc: Build every view once in a plain window and exit
    deps: [install]
    cmds:
      - node smoke.mjs
      - gjs -m dist/smoke.js

  typecheck:
    desc: Type-check the shell
    deps: [install]
    cmds:
      - bun run typecheck

  lint:
    desc: Lint TS/JS with oxlint and Svelte markup with ESLint
    cmds:
      - bun run lint

  lint:fix:
    desc: Apply oxlint and ESLint autofixes
    cmds:
      - bun run lint:fix

  monitors:
    desc: List monitor connectors
    cmds:
      - hyprctl monitors -j | jq -r '.[].name'
