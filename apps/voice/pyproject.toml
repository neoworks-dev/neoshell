[project]
name = "neoshell-voice"
version = "0.1.0"
description = "neoshell voice assistant sidecars: Whisper STT and Supertonic 3 TTS"
requires-python = ">=3.11,<3.13"
dependencies = [
    # faster-whisper: CTranslate2 Whisper, int8 on CPU (RTF ~0.2-0.4 for
    # `small`). Multilingual, German included. Silero VAD segments the mic
    # stream; Whisper decodes per segment (no streaming decoder).
    "faster-whisper>=1.0",
    "silero-vad>=5.1",
    "sounddevice>=0.4",
    "numpy>=1.26",
    "soxr>=0.5",
    # Supertonic 3: ONNX TTS, 31 languages, preset voices F1-F5/M1-M5 (no voice
    # cloning). Fast enough on CPU (RTF ~0.16-0.30) that the sidecars need no GPU;
    # pulls plain `onnxruntime` (CPU). For GPU, overlay the CUDA build after sync:
    # `uv pip install onnxruntime-gpu` (separate package, same import, so it can't
    # be co-declared here without the resolver dropping one).
    "supertonic>=1.3.1",
    # torch/torchaudio are pulled in by silero-vad.
]

[project.scripts]
neoshell-voice-stt = "neoshell_voice.stt:main"
neoshell-voice-tts = "neoshell_voice.tts:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["neoshell_voice"]
